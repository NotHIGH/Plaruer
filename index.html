<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202425">
  <title>Plaruer — Ashfall</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #e1e4df;
      --dim: #a5aaa7;
      --panel: rgba(27, 30, 31, .88);
      --edge: rgba(225, 230, 226, .22);
      --accent: #bec5c1;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #626666;
      color: var(--paper);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #world, #effects, #fog-fallback { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #world { z-index: 0; }
    #effects { z-index: 1; pointer-events: none; }
    #fog-fallback { z-index: 1; display: none; pointer-events: none; background: radial-gradient(ellipse at 50% 47%, transparent 15%, #c4c8c644 100%), linear-gradient(0deg, #c5c9c733, transparent 70%); }
    body.no-webgl #world { filter: grayscale(1) contrast(.9); }
    body.no-webgl #effects { display: none; }
    body.no-webgl #fog-fallback { display: block; }
    button { color: inherit; font: inherit; }
    .corner-count, .inventory-toggle, .inventory, .hotbar-slot, .attack, .joystick {
      border: 1px solid var(--edge);
      background: var(--panel);
      box-shadow: 0 8px 28px #10131466;
      backdrop-filter: blur(10px);
    }
    .corner-count {
      position: fixed; z-index: 3; top: max(16px, env(safe-area-inset-top)); left: 18px;
      padding: 8px 11px; border-radius: 4px; color: var(--dim);
      font: 10px "Courier New", monospace; letter-spacing: 1px; pointer-events: none;
    }
    .corner-count strong { color: var(--paper); font-size: 12px; font-weight: 400; }
    .inventory-toggle {
      position: fixed; z-index: 4; top: max(14px, env(safe-area-inset-top)); right: 16px;
      width: 42px; height: 42px; border-radius: 4px; cursor: pointer; font-size: 21px;
    }
    .inventory-toggle:hover, .attack:hover { border-color: #e6ebe7a0; background: #3b4040e8; }
    .inventory {
      position: fixed; z-index: 5; top: 50%; left: 50%; width: min(304px, calc(100vw - 32px));
      padding: 13px; border-radius: 5px; transform: translate(-50%, -50%);
    }
    .inventory[hidden] { display: none; }
    .inventory-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .inventory-title { color: var(--dim); font: 10px "Courier New", monospace; letter-spacing: 1.3px; }
    .inventory-close { width: 30px; height: 30px; border: 0; background: transparent; color: var(--dim); font-size: 22px; cursor: pointer; }
    .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .inventory-slot {
      aspect-ratio: 1; display: grid; place-items: center; position: relative;
      border: 1px solid #d5d9d433; border-radius: 3px; background: #11151666; cursor: pointer;
    }
    .inventory-slot.selected { border-color: #d9dfdcaa; background: #aeb5b522; }
    .item-icon { color: #d8ddda; font-size: 25px; line-height: 1; }
    .inventory-empty { color: #aab0ad50; font-size: 18px; }
    .inventory-foot { margin-top: 11px; color: #9ba19e; font: 9px "Courier New", monospace; letter-spacing: .6px; }
    .controls { position: fixed; z-index: 3; inset: 0; pointer-events: none; }
    .joystick-wrap {
      position: absolute; left: max(22px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom));
      width: 138px; height: 138px; display: grid; place-items: center; pointer-events: auto;
    }
    .joystick {
      position: relative; width: 126px; height: 126px; border-radius: 50%;
      background: radial-gradient(circle at 50% 45%, #777e7b40, #161a1bdd 74%);
      border-color: #d5dbd54a; touch-action: none;
    }
    .joystick::before, .joystick::after {
      content: ""; position: absolute; inset: 14px; border: 1px solid #dbe0dc22; border-radius: 50%;
    }
    .joystick::after { inset: 40px; }
    .joystick-stick {
      position: absolute; z-index: 1; left: 50%; top: 50%; width: 47px; height: 47px;
      margin: -23.5px; border: 1px solid #e0e5e077; border-radius: 50%;
      background: linear-gradient(145deg, #afb6b2, #626968);
      box-shadow: 0 5px 14px #0008, inset 0 1px 2px #ffffff66; transform: translate(0, 0);
    }
    .joystick.active .joystick-stick { background: linear-gradient(145deg, #d0d5d1, #808784); }
    .joystick-label { position: absolute; bottom: 10px; width: 100%; color: #e1e4df80; text-align: center; font: 8px "Courier New", monospace; letter-spacing: 1px; }
    .hotbar {
      position: fixed; z-index: 4; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
      display: flex; gap: 5px; transform: translateX(-50%); pointer-events: auto;
    }
    .hotbar-slot {
      position: relative; width: 58px; height: 58px; display: grid; place-items: center;
      border-radius: 4px; cursor: pointer; transition: background .14s, border-color .14s;
    }
    .hotbar-slot.selected { border-color: #eff2edcc; background: #555b5bd9; box-shadow: 0 0 0 1px #d9dfdc33, 0 8px 28px #10131488; }
    .hotbar-slot .item-icon { font-size: 28px; }
    .slot-key { position: absolute; top: 4px; left: 6px; color: #aeb4b0; font: 9px "Courier New", monospace; }
    .slot-empty { color: #b6bcba45; font: 18px "Courier New", monospace; }
    .attack {
      position: absolute; right: max(26px, env(safe-area-inset-right)); bottom: max(30px, env(safe-area-inset-bottom));
      width: 76px; height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; border-radius: 50%; cursor: pointer; pointer-events: auto; touch-action: none;
    }
    .attack:active { transform: scale(.95); background: #626a69e8; }
    .attack-icon { font-size: 22px; line-height: 1; }
    .attack-label { color: var(--dim); font: 8px "Courier New", monospace; letter-spacing: .9px; }
    .toast {
      position: fixed; z-index: 4; left: 50%; bottom: max(94px, calc(env(safe-area-inset-bottom) + 90px));
      padding: 8px 12px; border: 1px solid var(--edge); border-radius: 3px;
      background: #1a1e1fea; color: var(--paper); font: 10px "Courier New", monospace;
      opacity: 0; transform: translate(-50%, 7px); transition: opacity .14s, transform .14s; pointer-events: none;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 600px) {
      .corner-count { top: max(11px, env(safe-area-inset-top)); left: 11px; }
      .inventory-toggle { top: max(8px, env(safe-area-inset-top)); right: 10px; width: 40px; height: 40px; }
      .joystick-wrap { left: 7px; bottom: max(13px, env(safe-area-inset-bottom)); width: 112px; height: 112px; }
      .joystick { width: 104px; height: 104px; }
      .joystick::before { inset: 12px; }
      .joystick::after { inset: 34px; }
      .joystick-stick { width: 41px; height: 41px; margin: -20.5px; }
      .joystick-label { bottom: 7px; }
      .hotbar { bottom: max(17px, env(safe-area-inset-bottom)); gap: 4px; }
      .hotbar-slot { width: 50px; height: 50px; }
      .hotbar-slot .item-icon { font-size: 24px; }
      .slot-key { top: 3px; left: 5px; }
      .attack { right: max(12px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); width: 64px; height: 64px; }
      .attack-icon { font-size: 19px; }
      .toast { bottom: max(86px, calc(env(safe-area-inset-bottom) + 80px)); }
    }
    @media (max-width: 355px) {
      .hotbar-slot { width: 43px; height: 46px; }
      .joystick-wrap { left: 1px; }
      .attack { right: 7px; width: 58px; height: 58px; }
    }
  </style>
</head>
<body>
  <canvas id="world" aria-label="Процедурний ігровий світ"></canvas>
  <canvas id="effects" aria-hidden="true"></canvas>
  <div id="fog-fallback" aria-hidden="true"></div>
  <div class="corner-count" aria-live="polite">ЗОМБІ <strong id="zombie-count">00</strong></div>
  <button id="inventory-toggle" class="inventory-toggle" type="button" title="Інвентар" aria-label="Відкрити інвентар" aria-expanded="false" aria-controls="inventory">▤</button>
  <section id="inventory" class="inventory" role="dialog" aria-label="Інвентар гравця" hidden>
    <header class="inventory-head"><span class="inventory-title">ІНВЕНТАР</span><button id="inventory-close" class="inventory-close" type="button" aria-label="Закрити інвентар">×</button></header>
    <div class="inventory-grid">
      <button class="inventory-slot selected" type="button" aria-label="Меч"><span class="item-icon">⚔</span></button>
      <button class="inventory-slot" type="button" aria-label="Порожній слот"><span class="inventory-empty">·</span></button>
      <button class="inventory-slot" type="button" aria-label="Порожній слот"><span class="inventory-empty">·</span></button>
      <button class="inventory-slot" type="button" aria-label="Порожній слот"><span class="inventory-empty">·</span></button>
      <button class="inventory-slot" type="button" aria-label="Порожній слот"><span class="inventory-empty">·</span></button>
      <button class="inventory-slot" type="button" aria-label="Порожній слот"><span class="inventory-empty">·</span></button>
      <button class="inventory-slot" type="button" aria-label="Порожній слот"><span class="inventory-empty">·</span></button>
      <button class="inventory-slot" type="button" aria-label="Порожній слот"><span class="inventory-empty">·</span></button>
      <button class="inventory-slot" type="button" aria-label="Порожній слот"><span class="inventory-empty">·</span></button>
    </div>
    <footer class="inventory-foot">МЕЧ · 3 ВЛУЧАННЯ ДО ЗНИЩЕННЯ</footer>
  </section>
  <div class="controls">
    <div class="joystick-wrap"><div id="joystick" class="joystick" role="application" aria-label="Джойстик руху">
      <div id="joystick-stick" class="joystick-stick"></div><div class="joystick-label">РУХ</div>
    </div></div>
    <div class="hotbar" role="toolbar" aria-label="Хотбар">
      <button class="hotbar-slot selected" type="button" aria-label="Слот 1: меч"><span class="slot-key">1</span><span class="item-icon">⚔</span></button>
      <button class="hotbar-slot" type="button" aria-label="Слот 2: порожньо"><span class="slot-key">2</span><span class="slot-empty">·</span></button>
      <button class="hotbar-slot" type="button" aria-label="Слот 3: порожньо"><span class="slot-key">3</span><span class="slot-empty">·</span></button>
    </div>
    <button id="attack" class="attack" type="button" aria-label="Ударити мечем">
      <span class="attack-icon">⚔</span><span class="attack-label">УДАР</span>
    </button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="game.js"></script>
</body>
</html>
